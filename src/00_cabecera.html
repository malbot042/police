<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{display:flex;align-items:center;justify-content:center}
#screen{display:block;cursor:none;touch-action:none;box-shadow:0 0 80px rgba(80,120,255,.08)}
</style>
</head>
<body>
<canvas id="screen"></canvas>
<script>
'use strict';
(()=>{
// =====================================================================
//  BRECHA — acción táctica CQB con vista cenital
// =====================================================================
const ZOOMS=[[384,216,'CERCA'],[480,270,'NORMAL'],[576,324,'LEJOS'],[672,378,'MUY LEJOS']];
let ZI=2;try{const z=parseInt(localStorage.getItem('brecha_zoom'));if(z>=0&&z<ZOOMS.length)ZI=z;}catch(e){}
const COVER=/[?&]portada/.test(location.search);if(COVER)ZI=0;
let W=ZOOMS[ZI][0],H=ZOOMS[ZI][1];const TS=16;
const scr=document.getElementById('screen');
const dctx=scr.getContext('2d');
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
const game=mk(W,H),ctx=game.getContext('2d');
const fogC=mk(W,H),fctx=fogC.getContext('2d');
const bloomC=mk(W/2,H/2),bctx=bloomC.getContext('2d');
const chR=mk(W,H),chG=mk(W,H),chB=mk(W,H);
const noiseC=mk(128,128),nctx=noiseC.getContext('2d');
function setZoom(i,quiet){ZI=(i+ZOOMS.length)%ZOOMS.length;W=ZOOMS[ZI][0];H=ZOOMS[ZI][1];
 sizeCanvases();
 try{localStorage.setItem('brecha_zoom',ZI);}catch(e){}if(typeof resize==='function')resize();
 if(!quiet&&G.state==='play')radio('VISTA: '+ZOOMS[ZI][2],'#7fe6ff');}
let RS=2,CRT=true;try{CRT=localStorage.getItem('brecha_crt')!=='0';}catch(e){}
function sizeCanvases(){for(const c of[game,fogC,chR,chG,chB]){c.width=Math.round(W*RS);c.height=Math.round(H*RS);}bloomC.width=Math.ceil(W*RS/4);bloomC.height=Math.ceil(H*RS/4);}
let UIX=0,UIY=0;
function ui(fn){const sw=W,sh=H;UIX=(sw-384)>>1;UIY=(sh-216)>>1;ctx.save();ctx.translate(UIX,UIY);W=384;H=216;try{fn();}finally{W=sw;H=sh;ctx.restore();UIX=0;UIY=0;}}
function fullRect(){ctx.fillRect(-UIX-1,-UIY-1,game.width/RS+2,game.height/RS+2);}
const vmx=()=>mouse.x-((W-384)>>1),vmy=()=>mouse.y-((H-216)>>1);
let overlay=null,SC=1;
let FILTER_OK=false;try{bctx.filter='blur(1px)';FILTER_OK=bctx.filter==='blur(1px)';bctx.filter='none';}catch(e){}

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rand=(a,b)=>a+Math.random()*(b-a);
const rint=(a,b)=>Math.floor(rand(a,b+1));
const pick=a=>a[Math.random()*a.length|0];
const angDiff=(a,b)=>{let d=a-b;while(d>Math.PI)d-=6.2832;while(d<-Math.PI)d+=6.2832;return d;};
const turnTo=(a,t,m)=>{const d=angDiff(t,a);return Math.abs(d)<=m?t:a+Math.sign(d)*m;};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash(x,y){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;}
