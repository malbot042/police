// ===================== TEMAS Y BALDOSAS =====================
const F=(x,c,a,b,w=1,h=1)=>{x.fillStyle=c;x.fillRect(a,b,w,h);};
function T16(fn,seed){const c=mk(TS,TS),x=c.getContext('2d');fn(x,mulberry(seed));return c;}
function speck(x,R,cols,n){for(let i=0;i<n;i++)F(x,cols[R()*cols.length|0],R()*16|0,R()*16|0);}
function floorStyle(x,R,st,v){
 switch(st){
 case'wood':F(x,'#6a4428',0,0,16,16);for(let j=0;j<4;j++){F(x,j%2?'#734b2d':'#653f25',0,j*4,16,4);F(x,'#4a2e18',0,j*4+3,16,1);F(x,'#4a2e18',(j*7+v*5)%16,j*4,1,3);}speck(x,R,['#7d5636','#5a3820'],10);break;
 case'conc':F(x,'#45484d',0,0,16,16);speck(x,R,['#4d5056','#3e4146','#52555a'],30);F(x,'#393b40',0,15,16,1);F(x,'#393b40',15,0,1,16);if(v===1)for(let i=0;i<10;i++)F(x,'#2c2a26',5+R()*6|0,5+R()*6|0,2,1);if(v===2)F(x,'#c8a020',0,7,16,1);break;
 case'dirty':F(x,'#3e3d36',0,0,16,16);speck(x,R,['#46453c','#35342e','#4a4a3a','#2e3a26'],40);if(v)for(let i=0;i<12;i++)F(x,R()<.5?'#3a4a2a':'#2a2a22',4+R()*8|0,4+R()*8|0,2,2);break;
 case'marble':for(let j=0;j<2;j++)for(let i=0;i<2;i++)F(x,(i+j+v)%2?'#c8c2b6':'#8e887c',i*8,j*8,8,8);speck(x,R,['#d8d2c6','#a49e92'],8);F(x,'#6e6a60',0,0,16,1);F(x,'#6e6a60',0,0,1,16);break;
 case'club':F(x,'#18121f',0,0,16,16);F(x,'#261a33',0,0,16,1);F(x,'#261a33',0,0,1,16);speck(x,R,['#1e1628','#130e18'],14);if(v===1){F(x,'#ff3aa0',3,3);F(x,'#3affe0',11,10);}if(v===2){F(x,'#3a1a4a',2,2,12,12);F(x,'#4a2a5e',3,3,10,10);}break;
 case'carpet':F(x,'#5a1e24',0,0,16,16);for(let i=0;i<16;i+=4)for(let j=0;j<16;j+=4)if(((i+j)/4)%2===0)F(x,'#66262c',i+1,j+1,2,2);speck(x,R,['#4e1a1f','#6a2a30'],12);if(v===1)F(x,'#a88a3a',7,7,2,2);break;
 case'tile':F(x,'#b4b8bc',0,0,16,16);F(x,'#8a8e92',0,7,16,1);F(x,'#8a8e92',7,0,1,16);F(x,'#8a8e92',0,15,16,1);F(x,'#8a8e92',15,0,1,16);speck(x,R,['#c0c4c8','#a8acb0'],8);if(v===1)for(let i=0;i<6;i++)F(x,'#7a6a4a',R()*15|0,R()*15|0);break;
 case'street':F(x,'#26282c',0,0,16,16);speck(x,R,['#2e3034','#1f2124','#333539'],40);if(v===1)F(x,'#1a1b1e',R()*10|0,R()*10|0,5,3);break;
 case'walk':F(x,'#6a6a66',0,0,16,16);speck(x,R,['#727270','#5e5e5a'],20);F(x,'#55554f',0,15,16,1);F(x,'#55554f',15,0,1,16);break;
 case'grass':F(x,'#1d3516',0,0,16,16);speck(x,R,['#25421c','#172c12','#2d5222'],40);for(let i=0;i<6;i++){F(x,'#3f7a2a',R()*15|0,1+R()*14|0,1,2);}break;
 }}
const FLOORS={};function floorTile(st,v){const k=st+v;if(!FLOORS[k])FLOORS[k]=T16((x,R)=>floorStyle(x,R,st,v),v*31+st.length*7+st.charCodeAt(0));return FLOORS[k];}
const THEMES={
 piso:{n:'PISO',floor:'wood',alt:'tile',wall:['#a8a090','#cfc8b8','#7a7264','#4e483e'],furn:['sofa','mesa','cama','armario','planta','tv','estante'],song:1},

 banco:{n:'BANCO',floor:'marble',alt:'carpet',wall:['#a89a80','#c8bca0','#6e6450','#463f32'],furn:['mostrador','escritorio','planta','sillon','cajafuerte','escritorio'],song:3},

// ===================== MAPA =====================
const T={FLOOR:0,WALL:1,DOOR:2,OPEN:3,FURN:4,OUT:5,WIN:6,BROKEN:7};
const walkT=t=>t===0||t===3||t===5||t===7;
const pathT=t=>t!==1&&t!==4&&t!==6;
const opaqueT=t=>t===1||t===2;
let world=null;
function tget(x,y){if(x<0||y<0||x>=world.w||y>=world.h)return T.WALL;return world.t[y*world.w+x];}
function tset(x,y,v){world.t[y*world.w+x]=v;}
function genMap(M,seed){
 const R=mulberry(seed),Rp=a=>a[R()*a.length|0];const w=M.w,h=M.h;
 world={w,h,t:new Uint8Array(w*h).fill(T.OUT),seen:new Uint8Array(w*h),room:new Int16Array(w*h).fill(-1),door:new Map(),furn:new Map(),rooms:[],winBroken:new Set()};
 const bx0=1,by0=1,bx1=w-2,by1=h-7;world.by1=by1;
 for(let y=by0;y<=by1;y++)for(let x=bx0;x<=bx1;x++)tset(x,y,(x===bx0||x===bx1||y===by0||y===by1)?T.WALL:T.FLOOR);
 const addDoor=(x,y,o,lock)=>{tset(x,y,T.DOOR);world.door.set(y*w+x,{o,lock:!!lock,side:1});};
 function split(x,y,ww,hh){
  const mn=M.min,canV=ww>=2*mn+1,canH=hh>=2*mn+1;
  if((!canV&&!canH)||(ww*hh<=M.maxA&&R()<0.55))return;
  const ax=canV&&canH?(ww>hh*1.2?'v':hh>ww*1.2?'h':R()<.5?'v':'h'):canV?'v':'h';
  let c=-1;
  for(let k=0;k<24;k++){
   if(ax==='v'){const cc=x+mn+Math.floor(R()*(ww-2*mn));if(tget(cc,y-1)!==T.DOOR&&tget(cc,y+hh)!==T.DOOR){c=cc;break;}}
   else{const cc=y+mn+Math.floor(R()*(hh-2*mn));if(tget(x-1,cc)!==T.DOOR&&tget(x+ww,cc)!==T.DOOR){c=cc;break;}}}
  if(c<0)return;
  if(ax==='v'){for(let j=y;j<y+hh;j++)tset(c,j,T.WALL);const d=y+Math.floor(R()*hh);addDoor(c,d,'v',R()<M.lock);
   if(hh>=9&&R()<0.35){const d2=y+Math.floor(R()*hh);if(Math.abs(d2-d)>2)addDoor(c,d2,'v',false);}
   split(x,y,c-x,hh);split(c+1,y,x+ww-1-c,hh);}
  else{for(let i=x;i<x+ww;i++)tset(i,c,T.WALL);const d=x+Math.floor(R()*ww);addDoor(d,c,'h',R()<M.lock);
   if(ww>=9&&R()<0.35){const d2=x+Math.floor(R()*ww);if(Math.abs(d2-d)>2)addDoor(d2,c,'h',false);}
   split(x,y,ww,c-y);split(x,c+1,ww,y+hh-1-c);}
 }
 split(bx0+1,by0+1,bx1-bx0-1,by1-by0-1);
 // entrada principal
 let cand=[];for(let x=bx0+2;x<=bx1-2;x++)if(tget(x,by1-1)===T.FLOOR&&Math.abs(x-w/2)<w*0.3)cand.push(x);
 if(!cand.length)for(let x=bx0+2;x<=bx1-2;x++)if(tget(x,by1-1)===T.FLOOR)cand.push(x);
 const ex=Rp(cand);addDoor(ex,by1,'h',false);world.entry={x:ex,y:by1};
 // puerta trasera
 if(R()<0.7){const sd=R()<.5?bx0:bx1,c2=[];for(let y=by0+2;y<=by1-2;y++)if(tget(sd+(sd===bx0?1:-1),y)===T.FLOOR)c2.push(y);if(c2.length)addDoor(sd,Rp(c2),'v',R()<0.5);}
 floodRooms();
 // puertas extra (bucles)
 let loops=M.loops;
 for(let k=0;k<600&&loops>0;k++){const x=bx0+1+Math.floor(R()*(bx1-bx0-1)),y=by0+1+Math.floor(R()*(by1-by0-1));if(tget(x,y)!==T.WALL)continue;
  let near=false;for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++)if(tget(x+i,y+j)===T.DOOR)near=true;if(near)continue;
  const L=tget(x-1,y),Rr=tget(x+1,y),U=tget(x,y-1),D=tget(x,y+1),rm=(a,b)=>world.room[b*w+a];
  if(L===T.FLOOR&&Rr===T.FLOOR&&U===T.WALL&&D===T.WALL&&rm(x-1,y)!==rm(x+1,y)){addDoor(x,y,'v',false);loops--;}
  else if(U===T.FLOOR&&D===T.FLOOR&&L===T.WALL&&Rr===T.WALL&&rm(x,y-1)!==rm(x,y+1)){addDoor(x,y,'h',false);loops--;}}

function susFire(s,ST){if(s.cd>0)return;const[cx,cy]=ctr(s),n=ST.pel||1,sp=ST.spr*DF.acc*(s.seeT<0.8?1.7:1);
 for(let i=0;i<n;i++){const a=s.ang+rand(-sp,sp);bullets.push({x:cx+Math.cos(s.ang)*9,y:cy+Math.sin(s.ang)*9,px:cx,py:cy,vx:Math.cos(a)*ST.sp,vy:Math.sin(a)*ST.sp,life:ST.pel?0.4:0.9,dmg:ST.dmg*DF.dmg,from:'s',src:s,pel:!!ST.pel});}
 s.burstN++;if(s.burstN>=ST.burst){s.burstN=0;s.cd=(ST.gap||ST.rof)*rand(0.9,1.4);}else s.cd=ST.rof;
 s.mflash=0.06;if(ST.pel)SFX.shotgun();else SFX.eshot(s.vis?0.3:0.15);noise(cx,cy,300);G.inten=1;}
function updateSus(s,dt){
 if(s.dead||s.st==='cuffed')return;
 s.flash-=dt;s.shoutCd-=dt;s.cd-=dt;s.mflash-=dt;
 const[cx,cy]=ctr(s);
 if(s.stun>0){s.stun-=dt;s.ang+=Math.sin(G.t*7+s.seed)*dt*1.5;steer(s,null,0,dt);if(s.st==='idle')s.st='alert';s.seeing=false;return;}
 if(s.st==='surr'){s.surrT+=dt;steer(s,null,0,dt);
  if(s.surrT>s.fakeT){const gun=items.find(i=>i.type==='gun'&&i.owner===s);let near=false;for(const a of agents)if(!a.dead&&dist(a,s)<40)near=true;
   if(gun&&!near){items.splice(items.indexOf(gun),1);s.armed=true;s.st='fight';s.react=0.2;s.alertT=9;s.seeing=true;popup(cx,cy-12,'¡ARMA!','#ff3a3a');}else s.fakeT=s.surrT+rand(2,4);}
  return;}
 const ST=STYPE[s.type];
 let tgt=null,td=1e9;
 for(const a of agents){if(a.dead)continue;const[ax,ay]=ctr(a),d=Math.hypot(ax-cx,ay-cy);if(d>280||d>=td)continue;
  if(s.st==='idle'&&d>44&&Math.abs(angDiff(Math.atan2(ay-cy,ax-cx),s.ang))>1.05)continue;
  if(!losO(cx,cy,ax,ay))continue;tgt=a;td=d;}
 if(tgt){const[ax,ay]=ctr(tgt),a=Math.atan2(ay-cy,ax-cx);s.lx=ax;s.ly=ay;s.alertT=10;s.seeT+=dt;
  if(!s.seeing){s.seeing=true;s.react=((s.lost||9)<1.5?0.28:0.62)*DF.react*rand(0.8,1.3);if(s.st==='idle'||s.st==='alert')s.st=s.armed?'fight':'flee';}
  s.lost=0;
  if(s.armed){s.st='fight';s.ang=turnTo(s.ang,a,dt*5);s.react-=dt;if(s.react<=0&&Math.abs(angDiff(a,s.ang))<0.3)susFire(s,ST);
   if(s.aggr&&!s.captor&&td>100)steer(s,flowStep(s,flowP),50,dt);else steer(s,null,0,dt);}
  else{s.st='flee';const d=flowStep(s,flowP,true);s.ang=turnTo(s.ang,d?Math.atan2(d[1],d[0]):a+Math.PI,dt*6);steer(s,d,70,dt);
   if(!d||Math.hypot(s.vx,s.vy)<10){s.corner=(s.corner||0)+dt;if(s.corner>1.2&&td<130)surrender(s);}else s.corner=0;}}
 else{s.seeT=0;if(s.seeing){s.seeing=false;s.lost=0;}s.lost=(s.lost||0)+dt;
  if(s.st!=='idle'){s.alertT-=dt;const la=Math.atan2(s.ly-cy,s.lx-cx);
   if(s.armed&&s.aggr&&!s.captor&&s.alertT>0&&Math.hypot(s.lx-cx,s.ly-cy)>24){const d=flowStep(s,flowP);steer(s,d,44,dt);if(d)s.ang=turnTo(s.ang,Math.atan2(d[1],d[0]),dt*4);}
   else{steer(s,null,0,dt);s.ang=turnTo(s.ang,la,dt*3);}
   if(s.alertT<=0)s.st='alert';}
  else{s.wT-=dt;if(s.wT<0){s.wT=rand(2,5);s.wa=rand(0,6.283);}s.ang=turnTo(s.ang,s.wa,dt*1.2);steer(s,null,0,dt);}}
}
function updateCiv(c,dt){if(c.dead||c.gone)return;c.flash-=dt;
 if(c.stun>0){c.stun-=dt;steer(c,null,0,dt);return;}
 const[cx,cy]=ctr(c);
 switch(c.st){
  case'safe':{const d=flowStep(c,flowX);steer(c,d,58,dt);if(d)c.ang=turnTo(c.ang,Math.atan2(d[1],d[0]),dt*6);if(cy>(world.by1+1.5)*TS)c.gone=true;break;}
  case'panic':{c.panT-=dt;const ax=cx-c.fx,ay=cy-c.fy,l=Math.hypot(ax,ay)||1;steer(c,[ax/l,ay/l],62,dt);c.ang=turnTo(c.ang,Math.atan2(ay,ax),dt*8);if(c.panT<=0)c.st='cower';break;}
  case'comply':case'cower':steer(c,null,0,dt);break;
  default:{c.wT-=dt;if(c.wT<0){c.wT=rand(2,6);c.wa=rand(0,6.283);c.walkT=Math.random()<0.4?rand(0.5,1.5):0;}c.ang=turnTo(c.ang,c.wa,dt*2);if(c.walkT>0){c.walkT-=dt;steer(c,[Math.cos(c.ang),Math.sin(c.ang)],22,dt);}else steer(c,null,0,dt);}}}

function bloodAt(x,y,n){for(let i=0;i<n;i++){const a=rand(0,6.283),s=rand(20,70);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(0.15,0.35),max:0.35,c:'#a01818',sz:1,drag:6,col:true,stamp:'#6a1010'});}}
function pool(x,y){const d=world.dctx;d.fillStyle='rgba(90,10,10,0.55)';for(let i=0;i<10;i++){const a=rand(0,6.283),r=rand(0,5);d.beginPath();d.arc(x+Math.cos(a)*r,y+Math.sin(a)*r,rand(1.5,3.5),0,6.283);d.fill();}}
function hitChar(e,b){const[x,y]=ctr(e);e.flash=0.08;bloodAt(x,y,4);SFX.hit();
 if(e.kind==='agent'){if(e===P&&P.inv>0)return;e.hp-=b.dmg*(1-(e.armor||0));
  if(e===P){G.hurtFlash=0.35;G.shake=Math.max(G.shake,3);SFX.hurt();}
  if(e.hp<=0&&!e.dead){e.dead=true;SFX.die();pool(x,y);if(e!==P){G.stats.down++;radio('¡'+e.name+' ABATIDO!','#ff3a3a');}else radio('¡AGENTE CAIDO!','#ff3a3a');}return;}
 e.vx+=b.vx*0.05;e.vy+=b.vy*0.05;e.hp-=b.dmg;
 if(e.kind==='sus'){if(e.st==='idle'||e.st==='alert'){e.st=e.armed?'fight':'flee';e.react=Math.min(e.react,0.3);e.alertT=9;if(b.src){e.lx=b.src.x+5;e.ly=b.src.y+5;}}
  if(e.hp<=0)killSus(e,b.from);
  else if(e.armed&&e.st==='fight'&&Math.random()<0.3*(1-e.hp/e.max)*DF.surr)surrender(e);}
 else{if(b.from==='a'&&!e.hurtA){e.hurtA=true;G.stats.civHurt++;}
  if(e.hp<=0){e.dead=true;SFX.die();pool(x,y);if(e.st==='safe'){G.stats.civ--;}if(b.from==='a'){G.stats.civK++;radio('¡CIVIL ABATIDO POR LA POLICIA!','#ff3a3a');}else{G.stats.hostK++;radio('¡HAN MATADO A UN CIVIL!','#ff3a3a');}}
  else if(e.st!=='safe'){e.st='panic';e.panT=2;e.fx=b.x-b.vx*0.05;e.fy=b.y-b.vy*0.05;}}}
function killSus(s,from){const justified=(s.armed&&s.st!=='surr')||(s.st==='surr'&&G.time-(s.surrAt||0)<0.4);s.dead=true;SFX.die();const[x,y]=ctr(s);pool(x,y);
 if(from==='a'){if(justified)G.stats.neu++;else{G.stats.unj++;radio('FUERZA INJUSTIFICADA.','#ff9a2a');}}
 if(s.boss)G.stats.bossDead=1;
 if(s.armed)items.push({type:'gun',x:x+Math.cos(s.ang)*8,y:y+Math.sin(s.ang)*8,a:s.ang,owner:null});s.armed=false;}

// ===================== PROYECTILES =====================
function updateBullets(dt){
 for(const b of bullets){const st=Math.max(1,Math.ceil(Math.hypot(b.vx,b.vy)*dt/4)),sx=b.vx*dt/st,sy=b.vy*dt/st;b.px=b.x;b.py=b.y;
  for(let i=0;i<st&&!b.dead;i++){b.x+=sx;b.y+=sy;const tx=b.x/TS|0,ty=b.y/TS|0,t=tget(tx,ty);
   if(t===T.WALL||t===T.DOOR){b.dead=true;const hx=b.x-sx,hy=b.y-sy;for(let k=0;k<3;k++){const a=rand(0,6.283),s=rand(30,90);parts.push({x:hx,y:hy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(0.08,0.2),max:0.2,c:t===T.DOOR?'#a8744a':'#ffe0a0',sz:1,drag:4,glow:t!==T.DOOR});}
    world.dctx.fillStyle='rgba(0,0,0,0.6)';world.dctx.fillRect(Math.round(hx),Math.round(hy),1,1);break;}
   if(t===T.WIN){const k=ty*world.w+tx;if(!world.winBroken.has(k)){world.winBroken.add(k);drawWin(world.base.getContext('2d'),tx,ty);SFX.glass();for(let q=0;q<8;q++){const a=rand(0,6.283),s=rand(20,80);parts.push({x:b.x,y:b.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(0.2,0.5),max:0.5,c:'#bfe8ff',sz:1,drag:5,col:true,stamp:'#7fb8d8'});}}}
   const lists=b.from==='a'?[sus,civs]:[agents,civs];
   for(const L of lists){for(const e of L){if(e.dead||e.gone||e===b.src||(b.hit&&b.hit.includes(e)))continue;
     if(b.x>e.x-1&&b.x<e.x+e.w+1&&b.y>e.y-1&&b.y<e.y+e.h+1){hitChar(e,b);if(b.pierce>0){b.pierce--;(b.hit=b.hit||[]).push(e);}else b.dead=true;break;}}if(b.dead)break;}}
  b.life-=dt;if(b.life<=0)b.dead=true;}
 bullets=bullets.filter(b=>!b.dead);}
const nadeSolid=(x,y)=>{const t=tget(x/TS|0,y/TS|0);return t===T.WALL||t===T.DOOR||t===T.WIN;};
function updateNades(dt){for(const n of nades){n.fuse-=dt;n.vz-=400*dt;n.z+=n.vz*dt;if(n.z<=0){n.z=0;if(n.vz<-40){n.vz*=-0.35;SFX.bounce();}else n.vz=0;n.vx*=Math.max(0,1-dt*5);n.vy*=Math.max(0,1-dt*5);}
  n.rot+=dt*10;const nx=n.x+n.vx*dt;if(nadeSolid(nx,n.y)){n.vx*=-0.45;SFX.bounce();}else n.x=nx;const ny=n.y+n.vy*dt;if(nadeSolid(n.x,ny)){n.vy*=-0.45;SFX.bounce();}else n.y=ny;
  if(n.fuse<=0){n.dead=true;flashBang(n.x,n.y);}}nades=nades.filter(n=>!n.dead);}
function flashBang(x,y){SFX.flash();flashes.push({x,y,r:150,life:0.5,max:0.5});G.shake=Math.max(G.shake,4);noise(x,y,320);
 for(let i=0;i<20;i++){const a=rand(0,6.283),s=rand(40,160);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(0.15,0.4),max:0.4,c:'#ffffff',sz:1,drag:5,glow:true});}
 const d0=world.dctx;d0.globalAlpha=0.25;d0.fillStyle='#000';d0.beginPath();d0.arc(x,y,5,0,6.283);d0.fill();d0.globalAlpha=1;
 for(const e of sus.concat(civs)){if(e.dead||e.gone||e.st==='cuffed')continue;const[ex,ey]=ctr(e),d=Math.hypot(ex-x,ey-y);if(d<125&&losO(x,y,ex,ey)){e.stun=Math.max(e.stun,4*(1-d/170));if(e.kind==='sus'&&e.st==='idle')e.st='alert';}}
 for(const a of agents){if(a.dead)continue;const[ax,ay]=ctr(a),d=Math.hypot(ax-x,ay-y);if(d<115&&losO(x,y,ax,ay)&&Math.abs(angDiff(Math.atan2(y-ay,x-ax),a.ang))<1.5){if(a===P){G.blind=Math.max(G.blind,1.9*(1-d/150));SFX.ring();}else a.stun=Math.max(a.stun,1.2);}}}
function updateParts(dt){
 for(const p of parts){p.life-=dt;const dr=p.drag||0;p.vx*=Math.max(0,1-dr*dt);p.vy*=Math.max(0,1-dr*dt);p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.life<=0&&p.stamp&&world){world.dctx.fillStyle=p.stamp;world.dctx.fillRect(p.x|0,p.y|0,p.sz,p.sz);}}
 parts=parts.filter(p=>p.life>0);
 for(const p of popups){p.life-=dt;p.y-=12*dt;}popups=popups.filter(p=>p.life>0);
 for(const f of flashes)f.life-=dt;flashes=flashes.filter(f=>f.life>0);}
function updateItems(){for(const it of items){if(it.type!=='gun')continue;for(const a of agents){if(a.dead)continue;const[ax,ay]=ctr(a);if(Math.hypot(ax-it.x,ay-it.y)<9){it.dead=true;G.stats.guns++;popup(it.x,it.y-8,'ARMA ASEGURADA','#c8d0c0');SFX.pick();break;}}}items=items.filter(i=>!i.dead);}

// ===================== FLUJO DE PARTIDA =====================
function remaining(){let s=0,c=0,ev=0;for(const e of sus)if(!e.dead&&e.st!=='cuffed')s++;for(const e of civs)if(!e.dead&&e.st!=='safe'&&!e.gone)c++;for(const i of items)if(i.type==='ev')ev++;return{s,c,ev};}
function computeResults(){const S=G.stats,M=MISSIONS[G.mi],lines=[];
 const add=(l,n,v)=>{if(n)lines.push([l+' X'+n,n*v]);};
 add('DETENIDOS',S.arr,100);add('NEUTRALIZADOS',S.neu,25);add('CIVILES A SALVO',S.civ,50);add('PRUEBAS',S.ev,75);add('ARMAS ASEGURADAS',S.guns,10);
 if(M.boss)lines.push(S.boss?['CAPO DETENIDO VIVO',300]:['CAPO ABATIDO',-150]);
 add('FUERZA INJUSTIFICADA',S.unj,-150);add('CIVILES HERIDOS',S.civHurt,-40);add('CIVILES MUERTOS (POLICIA)',S.civK,-300);add('REHENES PERDIDOS',S.hostK,-100);add('AGENTES CAIDOS',S.down,-120);
 const par=60+G.nSus*18,tb=Math.max(0,Math.round((par-G.time)*3));lines.push(['TIEMPO '+fmtT(G.time)+' (BONUS)',tb]);
 const raw=lines.reduce((a,l)=>a+l[1],0),total=Math.max(0,Math.round(raw*DF.score));
 const max=G.nSus*100+G.nCiv*50+G.nEv*75+(M.boss?300:0),ratio=raw/Math.max(1,max);
 const grade=ratio>=0.95&&!S.unj&&!S.civK&&!S.down?'S':ratio>=0.8?'A':ratio>=0.6?'B':ratio>=0.4?'C':'D';
 const best=getBest(G.mi),rec=!best||total>best.s;if(rec)setBest(G.mi,{s:total,g:grade});
 G.res={lines,total,grade,rec};}
const fmtT=t=>{t=Math.max(0,t|0);return(t/60|0)+':'+String(t%60).padStart(2,'0');};
function updateCamera(dt){const[cx,cy]=ctr(P);const lx=(mouse.x-W/2)*0.3,ly=(mouse.y-H/2)*0.3;let tx=cx-W/2+lx,ty=cy-H/2+ly;const mx=world.w*TS-W,my=world.h*TS-H;tx=mx<0?mx/2:clamp(tx,0,mx);ty=my<0?my/2:clamp(ty,0,my);const k=Math.min(1,dt*7);G.camx+=(tx-G.camx)*k;G.camy+=(ty-G.camy)*k;}
function updateGame(dt){
 if(G.state==='play')G.time+=dt;G.inten=Math.max(0,G.inten-dt*0.12);G.lockHint=Math.max(0,(G.lockHint||0)-dt);G.blind=Math.max(0,G.blind-dt);G.msgT-=dt;
 if(G.orderPt)G.orderPt[2]-=dt;
 const pt=((P.y+5)/TS|0)*world.w+((P.x+5)/TS|0);if(pt!==flowPT||!flowP){flowP=computeFlow(pt%world.w,pt/world.w|0);flowPT=pt;}
 if(!P.dead)updatePlayer(dt);else{G.prompt=null;P.act=null;}
 for(const a of agents)if(a!==P)updateAlly(a,dt);
 for(const s of sus)updateSus(s,dt);
 for(const c of civs)updateCiv(c,dt);
 updateBullets(dt);updateNades(dt);updateParts(dt);updateItems();
 for(const r of G.radio)r.t-=dt;G.radio=G.radio.filter(r=>r.t>0);
 updateCamera(dt);
 if(P.dead){G.deadT+=dt;if(G.deadT>1.8&&G.state==='play'){G.state='fail';G.debT=0;SFX.fail();}return;}
 if(G.state==='play'){const r=remaining();if(!r.s&&!r.c&&!r.ev){G.state='clear';G.clearT=0;SFX.clear();radio('CENTRAL: ZONA ASEGURADA. BUEN TRABAJO.','#7dff3a');}}
 else if(G.state==='clear'){G.clearT+=dt;if(G.clearT>2.6){computeResults();G.state='debrief';G.debT=0;}}
}

// ===================== VISIÓN Y NIEBLA =====================
const VIS=[];
function castRay(ox,oy,dx,dy,maxR){const w=world.w,seen=world.seen;let tx=ox/TS|0,ty=oy/TS|0;
 const sX=dx>0?1:-1,sY=dy>0?1:-1,tDX=dx?Math.abs(TS/dx):1e9,tDY=dy?Math.abs(TS/dy):1e9;
 let tMX=dx>0?((tx+1)*TS-ox)/dx:dx<0?(tx*TS-ox)/dx:1e9,tMY=dy>0?((ty+1)*TS-oy)/dy:dy<0?(ty*TS-oy)/dy:1e9,d=0;
 if(tx>=0&&ty>=0&&tx<w&&ty<world.h)seen[ty*w+tx]=1;
 for(let n=0;n<80;n++){if(tMX<tMY){tx+=sX;d=tMX;tMX+=tDX;}else{ty+=sY;d=tMY;tMY+=tDY;}
  if(d>maxR)return maxR;if(tx<0||ty<0||tx>=w||ty>=world.h)return d;const k=ty*w+tx;seen[k]=1;if(opaqueT(world.t[k]))return d;}
 return maxR;}
function computeVision(){VIS.length=0;
 for(const a of agents){if(a.dead)continue;const isP=a===P,n=isP?360:150,R=isP?330:230,[ox,oy]=ctr(a),pts=new Float32Array(n*2);
  for(let i=0;i<n;i++){const an=i/n*6.28318,dx=Math.cos(an),dy=Math.sin(an),d=castRay(ox,oy,dx,dy,R),e=Math.min(R,d+6);pts[i*2]=ox+dx*e;pts[i*2+1]=oy+dy*e;}
  VIS.push({ox,oy,pts,R});}
 for(const e of sus.concat(civs)){e.vis=false;if(e.gone)continue;const[ex,ey]=ctr(e);for(const v of VIS){if(Math.hypot(ex-v.ox,ey-v.oy)<v.R&&losO(v.ox,v.oy,ex,ey)){e.vis=true;break;}}}}
function drawFog(cx,cy){const w=world.w;
 fctx.globalCompositeOperation='source-over';fctx.globalAlpha=1;fctx.fillStyle='#000';fctx.fillRect(0,0,W,H);
 fctx.globalCompositeOperation='destination-out';fctx.globalAlpha=0.45;
 const tx0=Math.max(0,Math.floor(cx/TS)),ty0=Math.max(0,Math.floor(cy/TS)),tx1=Math.min(w-1,Math.floor((cx+W)/TS)),ty1=Math.min(world.h-1,Math.floor((cy+H)/TS));
 for(let ty=ty0;ty<=ty1;ty++){let run=-1;for(let tx=tx0;tx<=tx1+1;tx++){const s=tx<=tx1&&world.seen[ty*w+tx];if(s&&run<0)run=tx;if(!s&&run>=0){fctx.fillRect(run*TS-cx,ty*TS-cy,(tx-run)*TS,TS);run=-1;}}}
 fctx.globalAlpha=1;
 for(const v of VIS){if(v.ox+v.R<cx||v.ox-v.R>cx+W||v.oy+v.R<cy||v.oy-v.R>cy+H)continue;const p=v.pts;fctx.beginPath();fctx.moveTo(p[0]-cx,p[1]-cy);for(let i=2;i<p.length;i+=2)fctx.lineTo(p[i]-cx,p[i+1]-cy);fctx.closePath();fctx.fill();}
 fctx.globalCompositeOperation='source-over';ctx.drawImage(fogC,0,0);}

function darkOf(img){if(!img.dark){const c=mk(img.width,img.height),x=c.getContext('2d');x.drawImage(img,0,0);x.globalCompositeOperation='source-atop';x.fillStyle='rgba(30,8,8,0.55)';x.fillRect(0,0,c.width,c.height);img.dark=c;}return img.dark;}
function sprFor(e){
 if(e.kind==='agent'){const kd=e===P?curW().kind:WPN[e.w].kind;return charSpr(e===P?'P':'A',e===P?PAL_PLY:PAL_POL,kd);}
 if(e.kind==='sus'){const pal=e.boss?PAL_BOSS:PAL_SUS[e.pi],pk=e.boss?'B':'S'+e.pi,kd=e.st==='cuffed'?'cuffed':e.st==='surr'?'up':e.armed?STYPE[e.type].kind:e.dead&&e.wasArmed?STYPE[e.type].kind:'unarmed';return charSpr(pk,pal,kd);}
 return charSpr('C'+e.pi,PAL_CIV[e.pi],(e.st==='comply'||e.st==='cower')?'up':'unarmed');}
function drawChar(e){const[x,y]=ctr(e),s=sprFor(e);
 ctx.fillStyle='rgba(0,0,0,0.35)';ctx.fillRect(Math.round(e.x),Math.round(e.y+8),10,3);

   let hit=-1;if(pressed['lmb']&&G.diffRects)G.diffRects.forEach((r,i)=>{const x=vmx(),y=vmy();if(x>=r[0]&&x<r[0]+r[2]&&y>=r[1]-3&&y<r[1]+r[3]+3)hit=i;});
   if(hit>=0){setDiff(hit);SFX.sw();}else if(ok||pressed[' ']){auInit();G.state='menu';SFX.ok();}break;}
  case'menu':updateMenu();break;

 }
